<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄工作法计时器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">番茄工作法计时器</h1>
        
        <div class="timer-container">
            <div class="timer-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
            </div>
            <div class="timer-label" id="timer-label">工作时间</div>
        </div>
        
        <div class="modes">
            <button id="work-mode" class="mode-btn mode-active" data-mode="work">工作 (25分钟)</button>
            <button id="short-break-mode" class="mode-btn" data-mode="short-break">短休息 (5分钟)</button>
            <button id="long-break-mode" class="mode-btn" data-mode="long-break">长休息 (15分钟)</button>
        </div>
        
        <div class="quick-time-buttons">
            <button class="quick-time-btn" data-minutes="5">5分钟</button>
            <button class="quick-time-btn" data-minutes="15">15分钟</button>
            <button class="quick-time-btn" data-minutes="25">25分钟</button>
            <button class="quick-time-btn" data-minutes="45">45分钟</button>
            <button class="quick-time-btn" data-minutes="60">60分钟</button>
        </div>
        
        <div class="time-input-section">
            <div class="time-input-group">
                <label for="custom-minutes">分钟</label>
                <input type="number" id="custom-minutes" min="0" max="120" value="25">
            </div>
            <div class="time-input-group">
                <label for="custom-seconds">秒</label>
                <input type="number" id="custom-seconds" min="0" max="59" value="0">
            </div>
        </div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-primary">开始</button>
            <button id="pause-btn" class="btn btn-secondary" style="display: none;">暂停</button>
            <button id="reset-btn" class="btn btn-secondary">重置</button>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">已完成番茄钟</span>
                <span class="stat-value" id="pomodoro-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">今日工作时长</span>
                <span class="stat-value" id="total-time">0分钟</span>
            </div>
        </div>
        
        <div class="more-options">
            <button id="more-options-btn" class="btn btn-secondary">工作循环 ⋯</button>
            
            <div class="dropdown-menu" id="more-options-menu" style="display: none;">
                <div class="dropdown-section">
                    <h4>工作循环</h4>
                    <div class="cycle-config" id="cycle-config">
                        <div class="cycle-config-row">
                            <div class="time-input-group">
                                <label for="cycle-pomodoros">番茄钟数</label>
                                <input type="number" id="cycle-pomodoros" min="1" max="20" value="4">
                            </div>
                            <div class="time-input-group">
                                <label for="cycle-name">循环名称</label>
                                <input type="text" id="cycle-name" value="工作循环" placeholder="可选">
                            </div>
                        </div>
                        
                        <div class="cycle-time-config">
                            <h5>时间设置</h5>
                            <div class="cycle-time-controls">
                                <div class="time-input-group">
                                    <label for="cycle-work-time">工作 (分钟)</label>
                                    <input type="number" id="cycle-work-time" min="1" max="60" value="25">
                                </div>
                                <div class="time-input-group">
                                    <label for="cycle-short-break">短休 (分钟)</label>
                                    <input type="number" id="cycle-short-break" min="1" max="30" value="5">
                                </div>
                                <div class="time-input-group">
                                    <label for="cycle-long-break">长休 (分钟)</label>
                                    <input type="number" id="cycle-long-break" min="1" max="60" value="15">
                                </div>
                            </div>
                        </div>
                        
                        <div class="cycle-buttons">
                            <button id="create-cycle-btn" class="btn btn-primary">创建循环</button>
                        </div>
                    </div>
                    
                    <div class="cycle-active" id="cycle-active" style="display: none;">
                        <div class="cycle-info">
                            <span class="cycle-name" id="active-cycle-name">工作循环</span>
                            <span class="cycle-progress" id="cycle-progress">0/4</span>
                        </div>
                        <div class="cycle-progress-bar">
                            <div class="cycle-progress-fill" id="cycle-progress-fill" style="width: 0%"></div>
                        </div>
                        <div class="cycle-segments" id="cycle-segments">
                        </div>
                        <div class="cycle-controls">
                            <button id="pause-cycle-btn" class="btn btn-secondary">暂停循环</button>
                            <button id="skip-segment-btn" class="btn btn-secondary">跳过当前阶段</button>
                            <button id="stop-cycle-btn" class="btn btn-secondary">结束循环</button>
                        </div>
                    </div>
                    
                    <div class="cycle-history" id="cycle-history" style="display: none;">
                        <h5>历史循环</h5>
                        <div class="cycle-history-list" id="cycle-history-list">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/timer.js"></script>
</body>
</html>
