<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄工作法计时器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">番茄工作法计时器</h1>
        
        <div class="timer-container">
            <div class="timer-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
            </div>
            <div class="timer-label" id="timer-label">工作时间</div>
        </div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-primary">开始</button>
            <button id="pause-btn" class="btn btn-secondary" style="display: none;">暂停</button>
            <button id="reset-btn" class="btn btn-secondary">重置</button>
        </div>
        
        <div class="modes">
            <button id="work-mode" class="mode-btn mode-active" data-mode="work">工作 (25分钟)</button>
            <button id="short-break-mode" class="mode-btn" data-mode="short-break">短休息 (5分钟)</button>
            <button id="long-break-mode" class="mode-btn" data-mode="long-break">长休息 (15分钟)</button>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">已完成番茄钟</span>
                <span class="stat-value" id="pomodoro-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">今日工作时长</span>
                <span class="stat-value" id="total-time">0分钟</span>
            </div>
        </div>
        
        <div class="tips">
            <h3>使用提示</h3>
            <ul>
                <li>选择工作模式后点击开始，专注工作25分钟</li>
                <li>工作完成后休息5分钟，4个番茄钟后休息15分钟</li>
                <li>保持专注，尽量避免中断</li>
            </ul>
        </div>
    </div>
    
    <script src="/static/js/timer.js"></script>
</body>
</html>
