<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄工作法计时器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">番茄工作法计时器</h1>
        
        <div class="timer-container">
            <div class="timer-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
            </div>
            <div class="timer-label" id="timer-label">工作时间</div>
        </div>
        
        <div class="modes">
            <button id="work-mode" class="mode-btn mode-active" data-mode="work">工作 (25分钟)</button>
            <button id="short-break-mode" class="mode-btn" data-mode="short-break">短休息 (5分钟)</button>
            <button id="long-break-mode" class="mode-btn" data-mode="long-break">长休息 (15分钟)</button>
        </div>
        
        <div class="quick-time-buttons">
            <button class="quick-time-btn" data-minutes="5">5分钟</button>
            <button class="quick-time-btn" data-minutes="15">15分钟</button>
            <button class="quick-time-btn" data-minutes="25">25分钟</button>
            <button class="quick-time-btn" data-minutes="45">45分钟</button>
            <button class="quick-time-btn" data-minutes="60">60分钟</button>
        </div>
        
        <div class="time-input-section">
            <div class="time-input-group">
                <label for="custom-minutes">分钟</label>
                <input type="number" id="custom-minutes" min="1" max="120" value="25">
            </div>
            <div class="time-input-group">
                <label for="custom-seconds">秒</label>
                <input type="number" id="custom-seconds" min="0" max="59" value="0">
            </div>
        </div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-primary">开始</button>
            <button id="pause-btn" class="btn btn-secondary" style="display: none;">暂停</button>
            <button id="reset-btn" class="btn btn-secondary">重置</button>
        </div>
        
        <div class="custom-time-section">
            <h3>自定义时间设置</h3>
            <div class="custom-time-controls">
                <div class="time-input-group">
                    <label for="custom-work-time">工作时间 (分钟)</label>
                    <input type="number" id="custom-work-time" min="1" max="60" value="25">
                </div>
                <div class="time-input-group">
                    <label for="custom-short-break">短休息 (分钟)</label>
                    <input type="number" id="custom-short-break" min="1" max="30" value="5">
                </div>
                <div class="time-input-group">
                    <label for="custom-long-break">长休息 (分钟)</label>
                    <input type="number" id="custom-long-break" min="1" max="60" value="15">
                </div>
            </div>
            <button id="apply-custom-time" class="btn btn-secondary">应用自定义时间</button>
            <button id="reset-default-time" class="btn btn-secondary">恢复默认</button>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">已完成番茄钟</span>
                <span class="stat-value" id="pomodoro-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">今日工作时长</span>
                <span class="stat-value" id="total-time">0分钟</span>
            </div>
        </div>
        
        <div class="tips">
            <h3>使用提示</h3>
            <ul>
                <li>选择工作模式后点击开始，专注工作25分钟</li>
                <li>工作完成后休息5分钟，4个番茄钟后休息15分钟</li>
                <li>也可以使用快速按钮或自定义时间进行倒计时</li>
            </ul>
        </div>
    </div>
    
    <script src="/static/js/timer.js"></script>
</body>
</html>
