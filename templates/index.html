<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄工作法计时器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">番茄工作法计时器</h1>
        
        <div class="timer-container">
            <div class="timer-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
            </div>
        </div>
        
        <div class="quick-time-buttons">
            <button class="quick-time-btn" data-minutes="5">5分钟</button>
            <button class="quick-time-btn" data-minutes="15">15分钟</button>
            <button class="quick-time-btn" data-minutes="25">25分钟</button>
            <button class="quick-time-btn" data-minutes="45">45分钟</button>
            <button class="quick-time-btn" data-minutes="60">60分钟</button>
        </div>
        
        <div class="time-input-section">
            <div class="time-input-group">
                <label for="custom-minutes">分钟</label>
                <input type="number" id="custom-minutes" min="1" max="120" value="25">
            </div>
            <div class="time-input-group">
                <label for="custom-seconds">秒</label>
                <input type="number" id="custom-seconds" min="0" max="59" value="0">
            </div>
        </div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-primary">开始</button>
            <button id="pause-btn" class="btn btn-secondary" style="display: none;">暂停</button>
            <button id="reset-btn" class="btn btn-secondary">重置</button>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">已完成番茄钟</span>
                <span class="stat-value" id="pomodoro-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">今日工作时长</span>
                <span class="stat-value" id="total-time">0分钟</span>
            </div>
        </div>
        
        <div class="tips">
            <h3>使用提示</h3>
            <ul>
                <li>点击上方快速按钮或在下方输入框中设置时间</li>
                <li>设置好时间后点击开始按钮开始倒计时</li>
                <li>保持专注，尽量避免中断</li>
            </ul>
        </div>
    </div>
    
    <script src="/static/js/timer.js"></script>
</body>
</html>
