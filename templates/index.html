<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全沙箱 - 代码执行环境</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>安全沙箱 - 代码执行环境</h1>
            <div class="header-controls">
                <button id="clearAllBtn" class="btn btn-danger">清空所有容器</button>
            </div>
        </header>

        <div class="main-content">
            <div class="sessions-panel">
                <div class="panel-header">
                    <h2>会话管理</h2>
                    <button id="newSessionBtn" class="btn btn-primary">新建会话</button>
                </div>
                <div class="session-list" id="sessionList">
                    <div class="empty-message">暂无运行中的会话</div>
                </div>
            </div>

            <div class="editor-panel">
                <div class="editor-header">
                    <div class="language-selector">
                        <label for="languageSelect">语言:</label>
                        <select id="languageSelect">
                            <option value="python" selected>Python</option>
                            <option value="javascript">JavaScript</option>
                        </select>
                    </div>
                    <div class="session-info" id="sessionInfo">
                        <span id="currentSession">未选择会话</span>
                    </div>
                    <div class="editor-controls">
                        <button id="runBtn" class="btn btn-success" disabled>运行</button>
                        <button id="stopSessionBtn" class="btn btn-warning" disabled>停止会话</button>
                    </div>
                </div>
                <div class="editor-container">
                    <textarea id="codeEditor" placeholder="在此输入代码..."></textarea>
                </div>
                <div class="output-container">
                    <div class="output-header">
                        <h3>输出</h3>
                        <button id="clearOutputBtn" class="btn btn-small">清空</button>
                    </div>
                    <div class="output-content" id="outputContent">
                        <div class="output-item">
                            <span class="output-label info">[系统]</span>
                            <span class="output-text">准备就绪。请创建或选择一个会话开始执行代码。</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">确认</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <p>确定要执行此操作吗？</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancel">取消</button>
                <button class="btn btn-primary" id="modalConfirm">确认</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
